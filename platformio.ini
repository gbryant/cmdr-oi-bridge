[platformio]
src_dir = src

[env:cmdr-oi-bridge]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/version_stamp.py
build_flags =
    -DMAX_COMMANDS=9
    -DCOMMANDER_R4_OTA
    -DCOMMANDER_R4_RUNNER
    -I${PROJECT_DIR}
    ; FreeRTOS hardening: report stack overflow / heap exhaustion instead of a
    ; silent corruption that wedges the ESP32-S3 bridge. Hooks live in the runner.
    -DconfigCHECK_FOR_STACK_OVERFLOW=2
    -DconfigUSE_MALLOC_FAILED_HOOK=1
lib_deps =
    ArduinoOTA @ ^1.0.0
    ; release pin — bump the #tag to adopt a newer commander release
    https://github.com/gbryant/commander.git#v1.0
